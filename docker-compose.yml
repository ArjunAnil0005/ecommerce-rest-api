services:
  mongo:
    image: mongo:7
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { if (rs.status().myState === 1) quit(0); quit(1); } catch (error) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); quit(1); }",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/ecommerce?replicaSet=rs0
    ports:
      - '5000:5000'
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
